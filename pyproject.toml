[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "subfontmkv"
version = "1.0.0"
description = "把外挂字幕和字体软封装进 MKV：字幕成为软字幕轨，字体作为附件内嵌"
readme = "README.md"
requires-python = ">=3.7"
license = { text = "Apache-2.0" }
authors = [{ name = "SubFontMKV contributors" }]
keywords = ["mkv", "subtitle", "font", "subset", "mkvmerge", "ass"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
  "Topic :: Text Processing :: Fonts",
]
dependencies = ["fonttools>=4.30"]

[project.optional-dependencies]
gui = ["tkinterdnd2>=0.3"]
charset = ["chardet>=4.0"]

[project.scripts]
subfontmkv = "subfontmkv.cli:main"

[project.gui-scripts]
subfontmkv-gui = "subfontmkv.gui:main"

[tool.setuptools]
packages = ["subfontmkv"]
